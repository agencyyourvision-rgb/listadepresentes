<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Presentes">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="A lista de presentes da família: veja o que cada um gostaria de ganhar.">
<title>Lista de Presentes</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<style>
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Inter", "Helvetica Neue", Arial, sans-serif;
  --accent: rgb(0,122,255);
  --accent-press: rgb(0,100,220);
  --red: rgb(255,56,60);
  --green: rgb(36,170,72);
  --orange: rgb(255,141,40);
  --label: rgba(0,0,0,.92);
  --label-2: rgba(60,60,67,.74);
  --label-3: rgba(60,60,67,.42);
  --bg: #f2f2f7; --bg-rgb: 242 242 247;
  --card: #ffffff;
  --fill: rgba(120,120,128,.14);
  --fill-2: rgba(120,120,128,.24);
  --separator: rgba(60,60,67,.18);
  --glass-tint: 255 255 255;
  --shadow-card: 0 1px 2px rgb(0 0 0 / .04), 0 4px 16px rgb(0 0 0 / .05);
  --ease-out: cubic-bezier(.2,.8,.2,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --accent: rgb(10,132,255); --accent-press: rgb(64,156,255);
    --red: rgb(255,69,58); --green: rgb(48,209,88); --orange: rgb(255,159,10);
    --label: rgba(255,255,255,.95); --label-2: rgba(235,235,245,.72); --label-3: rgba(235,235,245,.4);
    --bg: #000; --bg-rgb: 0 0 0; --card: #1c1c1e;
    --fill: rgba(120,120,128,.26); --fill-2: rgba(120,120,128,.38);
    --separator: rgba(84,84,88,.6); --glass-tint: 44 44 48; --shadow-card: none;
  }
}
*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html{ font-size: 18px; -webkit-text-size-adjust: 100%; }
html.letra-2{ font-size: 20px; }
html.letra-3{ font-size: 22px; }
body{
  margin:0; min-height:100dvh; background: var(--bg); color: var(--label);
  font: 400 1rem/1.38 var(--font); letter-spacing: -0.015em;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
}
body::before{
  content:""; position: fixed; inset: -20vh -20vw auto -20vw; height: 70vh; z-index:-1; pointer-events:none;
  background:
    radial-gradient(40% 50% at 20% 30%, rgb(255 59 48 / .15), transparent 70%),
    radial-gradient(40% 50% at 80% 20%, rgb(52 199 89 / .15), transparent 70%),
    radial-gradient(40% 45% at 55% 60%, rgb(255 204 0 / .11), transparent 70%);
}
button{ font: inherit; color: inherit; letter-spacing: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
input, textarea{ font: inherit; letter-spacing: inherit; color: inherit; }
a{ color: var(--accent); }
b, strong{ font-weight: 650; }

/* ---------- Vidro (só barra e controles flutuantes) ---------- */
.glass{
  position: relative; isolation: isolate;
  background: rgb(var(--glass-tint) / .66);
  -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .6), inset 0 0 0 .5px rgb(255 255 255 / .3),
              0 6px 20px rgb(0 0 0 / .10), 0 1px 3px rgb(0 0 0 / .06);
}
@media (prefers-color-scheme: dark){
  .glass{ box-shadow: inset 0 1px 0 rgb(255 255 255 / .18), inset 0 0 0 .5px rgb(255 255 255 / .12), 0 8px 24px rgb(0 0 0 / .45); }
}
.press{ transition: transform .14s var(--ease-out), background-color .2s, opacity .2s; }
.press:active{ transform: scale(.96); }
:focus-visible{ outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 14px; }

/* ---------- Barra superior ---------- */
.topbar{
  position: fixed; z-index: 20; left: 0; right: 0; top: 0;
  padding: calc(var(--safe-t) + 10px) 14px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; pointer-events: none;
}
.topbar > *{ pointer-events: auto; }
.top-title{
  position: absolute; left: 50%; transform: translate(-50%, 4px); bottom: 20px;
  font-weight: 650; font-size: .95rem; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
  max-width: 40vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.scrolled .top-title{ opacity: 1; transform: translate(-50%, 0); }
.pill{
  height: 48px; min-width: 48px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 0 16px 0 12px; font-weight: 650; font-size: .95rem; color: var(--accent); white-space: nowrap;
}
.pill svg{ width: 22px; height: 22px; flex: none; }
.scroll-edge{
  position: fixed; inset: 0 0 auto 0; height: calc(var(--safe-t) + 96px); z-index: 15; pointer-events: none;
  -webkit-backdrop-filter: blur(16px) saturate(150%); backdrop-filter: blur(16px) saturate(150%);
  -webkit-mask: linear-gradient(to bottom, #000 60%, transparent); mask: linear-gradient(to bottom, #000 60%, transparent);
  background: linear-gradient(to bottom, rgb(var(--bg-rgb) / .84) 45%, rgb(var(--bg-rgb) / 0));
  opacity: 0; transition: opacity .25s;
}
.scrolled .scroll-edge{ opacity: 1; }

/* ---------- Ecrãs ---------- */
main{ max-width: 640px; margin: 0 auto; padding: calc(var(--safe-t) + 74px) 18px calc(var(--safe-b) + 56px); }
main.sem-barra{ padding-top: calc(var(--safe-t) + 28px); }
.in-fwd{ animation: inFwd .38s var(--ease-out) both; }
.in-back{ animation: inBack .38s var(--ease-out) both; }
@keyframes inFwd{ from{ opacity: 0; transform: translateX(36px);} }
@keyframes inBack{ from{ opacity: 0; transform: translateX(-36px);} }

.card{ background: var(--card); border-radius: 22px; box-shadow: var(--shadow-card); }
.muted{ color: var(--label-2); }
.center{ text-align: center; }
.h-sec{ font-size: 1.25rem; font-weight: 750; margin: 0 4px 4px; letter-spacing: -0.02em; }
.p-sec{ margin: 0 4px 14px; color: var(--label-2); font-size: .95rem; }

/* ---------- Boas-vindas ---------- */
.welcome{ text-align: center; padding-top: 8px; }
.big-gift{ font-size: 4.2rem; line-height: 1; display: inline-block; animation: bob 3.4s ease-in-out infinite; }
@keyframes bob{ 50%{ transform: translateY(-6px) rotate(-3deg); } }
.welcome h1{ font-size: 2rem; font-weight: 800; letter-spacing: -0.025em; margin: 14px 0 10px; line-height: 1.12; }
.welcome .lead{ font-size: 1.1rem; color: var(--label-2); margin: 0 auto 26px; max-width: 28em; }
.steps{ display: flex; flex-direction: column; gap: 10px; text-align: left; margin-bottom: 26px; }
.step{ display: flex; gap: 14px; align-items: center; padding: 16px; }
.step .n{
  flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: #fff; font-weight: 750; font-size: 1.1rem; letter-spacing: 0;
}
.step .st{ display: block; font-size: 1.05rem; font-weight: 650; }
.step span.t{ color: var(--label-2); font-size: .93rem; }

/* ---------- Início ---------- */
.hero{ text-align: center; padding: 6px 8px 22px; }
.hero .big-gift{ font-size: 3.2rem; }
.hero h1{ font-size: 2.05rem; line-height: 1.12; font-weight: 800; letter-spacing: -0.025em; margin: 10px 0 6px; }
.hero p{ margin: 0; color: var(--label-2); font-size: 1.02rem; }
.cta-main{
  width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
  background: var(--accent); color: #fff; border-radius: 22px; padding: 16px 16px 16px 14px; margin: 0 0 8px;
  box-shadow: 0 8px 24px rgb(0 122 255 / .28);
}
.cta-main .ic{ width: 52px; height: 52px; border-radius: 50%; background: rgb(255 255 255 / .22); display: grid; place-items: center; font-size: 1.6rem; flex: none; }
.cta-main .avatar{ --size: 52px; font-size: 1.2rem; box-shadow: 0 0 0 2.5px rgb(255 255 255 / .9); }
.cta-main .t1{ display:block; font-size: .88rem; opacity: .9; }
.cta-main .t2{ display:block; font-size: 1.15rem; font-weight: 750; line-height: 1.2; }
.cta-main .chev{ margin-left: auto; width: 22px; height: 22px; opacity: .9; flex: none; }
.not-me{ display: block; margin: 0 auto 26px; padding: 10px 14px; color: var(--accent); font-weight: 600; font-size: .92rem; }
.spacer-26{ height: 18px; }
.grid{ display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
@media (min-width: 560px){ .grid{ grid-template-columns: repeat(3, minmax(0,1fr)); } }
.person{
  position: relative; background: var(--card); border-radius: 24px; box-shadow: var(--shadow-card);
  padding: 20px 10px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  min-height: 170px; justify-content: center;
}
.person .pname{ font-size: 1.12rem; font-weight: 750; line-height: 1.2; overflow-wrap: anywhere; }
.person .pcount{ font-size: .84rem; color: var(--label-2); margin-top: -6px; }
.person .pcount.has{ color: var(--green); font-weight: 650; }
.person.me{ box-shadow: 0 0 0 3px var(--accent), var(--shadow-card); }
.badge{ position: absolute; top: 10px; right: 10px; background: var(--accent); color: #fff; font-size: .7rem; font-weight: 750; padding: 3px 9px; border-radius: 999px; letter-spacing: 0; }
.avatar{
  --size: 72px; width: var(--size); height: var(--size); border-radius: 50%; flex: none;
  display: grid; place-items: center; color: #fff; font-weight: 750; font-size: 1.65rem; letter-spacing: 0;
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c));
  text-shadow: 0 1px 2px rgb(0 0 0 / .15);
}
.notice{
  display: flex; gap: 12px; align-items: flex-start; padding: 14px 14px 14px 16px; margin: 0 0 18px;
  background: color-mix(in srgb, var(--orange) 14%, var(--card)); border-radius: 18px; font-size: .93rem;
}
.notice .x{ margin-left: auto; flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--label-2); background: var(--fill); }
.notice .x svg{ width: 14px; height: 14px; }
.foot-note{ text-align:center; color: var(--label-3); font-size: .8rem; margin-top: 30px; }

/* ---------- Quem é você ---------- */
.rows{ display: flex; flex-direction: column; overflow: hidden; }
.row{ display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 76px; text-align: left; width: 100%; }
.row + .row{ border-top: .5px solid var(--separator); }
.row .avatar{ --size: 52px; font-size: 1.15rem; }
.row .rn{ font-size: 1.15rem; font-weight: 650; flex: 1; overflow-wrap: anywhere; }
.row .chev{ width: 20px; height: 20px; color: var(--label-3); flex: none; }
.row:active{ background: var(--fill); }

/* ---------- Perfil ---------- */
.prof-head{ text-align: center; padding: 4px 0 20px; }
.prof-head .avatar{ --size: 92px; font-size: 2.3rem; margin: 0 auto 12px; box-shadow: 0 10px 30px color-mix(in srgb, var(--c) 35%, transparent); }
.prof-head h1{ font-size: 1.9rem; font-weight: 800; letter-spacing: -0.025em; margin: 0 0 4px; line-height: 1.15; overflow-wrap: anywhere; }
.prof-head p{ margin: 0; color: var(--label-2); font-size: 1rem; }
.sizes{ padding: 16px 16px 16px 18px; margin-bottom: 18px; }
.sizes-top{ display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.sizes-top h2{ margin: 0; font-size: 1.04rem; font-weight: 700; }
.size-chips{ display: flex; flex-wrap: wrap; gap: 8px; }
.size-chip{ background: var(--fill); border-radius: 14px; padding: 8px 12px; font-size: .95rem; }
.size-chip small{ display: block; color: var(--label-2); font-size: .74rem; font-weight: 600; }
.size-chip b{ font-size: 1.05rem; }
.sizes .det{ margin-top: 10px; }
.sizes-empty{ width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; margin-bottom: 18px; }
.sizes-empty .ic{ font-size: 1.6rem; flex: none; }
.sizes-empty b{ display: block; color: var(--accent); }
.sizes-empty span.t{ display: block; color: var(--label-2); font-size: .88rem; }
.list{ display: flex; flex-direction: column; gap: 12px; }
.item{ padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 10px; animation: pop .35s var(--ease-out) both; }
@keyframes pop{ from{ opacity: 0; transform: translateY(8px) scale(.98); } }
.item-top{ display: flex; align-items: flex-start; gap: 12px; }
.num{ flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); font-weight: 750; font-size: .9rem; color: var(--label-2); letter-spacing: 0; margin-top: 1px; }
.item h3{ margin: 4px 0 0; font-size: 1.12rem; font-weight: 750; line-height: 1.25; flex: 1; overflow-wrap: anywhere; }
.edit-btn{ flex: none; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--fill); color: var(--accent); font-weight: 650; font-size: .88rem; display: inline-flex; align-items: center; gap: 6px; margin: -3px -2px 0 0; }
.edit-btn svg{ width: 16px; height: 16px; }
.item-body{ display: flex; flex-direction: column; gap: 10px; padding-left: 46px; }
.tags{ display: flex; flex-wrap: wrap; gap: 8px; }
.tag{ display: inline-flex; align-items: center; gap: 8px; background: var(--fill); border-radius: 999px; padding: 6px 13px 6px 9px; font-size: .9rem; font-weight: 500; }
.dot{ width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .16); flex: none; }
.det{ margin: 0; color: var(--label-2); font-size: .97rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.link-btn{
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--accent);
  background: color-mix(in srgb, var(--accent) 11%, transparent); border-radius: 16px; padding: 12px 14px; font-weight: 650; font-size: .97rem; min-height: 52px;
}
.link-btn .dom{ color: var(--label-2); font-weight: 500; font-size: .84rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-btn .lt{ min-width: 0; flex: 1; }
.link-btn svg{ width: 20px; height: 20px; flex: none; }
.add-card{
  width: 100%; display: flex; align-items: center; gap: 16px; padding: 18px;
  border-radius: 22px; border: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent);
  background: color-mix(in srgb, var(--accent) 6%, transparent); color: var(--accent); text-align: left;
}
.add-card .plus{ width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: #fff; flex: none; display: grid; place-items: center; box-shadow: 0 6px 16px rgb(0 122 255 / .35); }
.add-card .plus svg{ width: 26px; height: 26px; }
.add-card .a1{ display: block; font-weight: 750; font-size: 1.08rem; }
.add-card .a2{ display: block; color: var(--label-2); font-size: .88rem; margin-top: 2px; }
.empty{ text-align: center; padding: 26px 20px; color: var(--label-2); }
.empty .e-ico{ font-size: 2.6rem; display: block; margin-bottom: 8px; }
.empty b{ color: var(--label); display:block; font-size: 1.08rem; margin-bottom: 4px; }
.owner-cta{ margin-top: 24px; padding: 18px; text-align: center; }
.owner-cta p{ margin: 0 0 12px; color: var(--label-2); font-size: .95rem; }
.install-card{ margin-top: 22px; padding: 16px; display: flex; gap: 14px; align-items: flex-start; }
.install-card .ic{ font-size: 1.8rem; line-height: 1; flex: none; }
.install-card b{ display: block; margin-bottom: 2px; }
.install-card .t{ color: var(--label-2); font-size: .92rem; }
.install-card .acts{ display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.mini-btn{ height: 40px; padding: 0 16px; border-radius: 999px; background: var(--fill); color: var(--accent); font-weight: 650; font-size: .9rem; }
.mini-btn.blue{ background: var(--accent); color: #fff; }
.skeleton{ height: 96px; border-radius: 22px; background: var(--card); position: relative; overflow: hidden; }
.skeleton::after{ content:""; position:absolute; inset:0; background: linear-gradient(90deg, transparent, var(--fill), transparent); animation: shimmer 1.2s infinite; }
@keyframes shimmer{ from{ transform: translateX(-100%);} to{ transform: translateX(100%);} }

/* ---------- Botões ---------- */
.btn{ width: 100%; min-height: 58px; border-radius: 16px; font-weight: 650; font-size: 1.06rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 20px; text-decoration: none; }
.btn-primary{ background: var(--accent); color: #fff; }
.btn-primary:active{ background: var(--accent-press); }
.btn-primary[disabled]{ opacity: .45; }
.btn-gray{ background: var(--fill); color: var(--accent); }
.btn-red{ background: var(--red); color: #fff; }
.btn-green{ background: #25D366; color: #fff; }
.btn-danger{ background: transparent; color: var(--red); }
.btn + .btn{ margin-top: 10px; }
.link-text{ display: inline-block; padding: 12px 10px; color: var(--accent); font-weight: 600; font-size: .95rem; }

/* ---------- Folhas ---------- */
.backdrop{ position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / .34); display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .25s ease both; }
.backdrop.out{ animation: fadeOut .22s ease both; }
@keyframes fadeIn{ from{ opacity: 0; } }
@keyframes fadeOut{ to{ opacity: 0; } }
.sheet{
  width: min(100% - 16px, 560px); margin-bottom: calc(8px + var(--safe-b));
  max-height: calc(100dvh - var(--safe-t) - 20px); overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg); border-radius: 34px; padding: 10px 18px 20px; box-shadow: 0 -10px 40px rgb(0 0 0 / .2);
  animation: sheetIn .42s var(--ease-out) both;
}
@media (prefers-color-scheme: dark){ .sheet{ background: #1c1c1e; } .sheet .field, .sheet .group, .sheet .card{ background: #2c2c2e; } }
.backdrop.out .sheet{ animation: sheetOut .22s ease-in both; }
@keyframes sheetIn{ from{ transform: translateY(105%); } }
@keyframes sheetOut{ to{ transform: translateY(105%); } }
.grabber{ width: 40px; height: 5px; border-radius: 3px; background: var(--label-3); margin: 0 auto 8px; }
.sheet-head{ display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 14px; }
.sheet-head h2{ margin: 0; font-size: 1.3rem; font-weight: 750; flex: 1; }
.close-x{ width: 44px; height: 44px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--label-2); flex: none; }
.close-x svg{ width: 18px; height: 18px; }
.sheet-intro{ margin: -6px 2px 16px; color: var(--label-2); font-size: .95rem; }
.dialog{ text-align: center; padding: 10px 4px 4px; }
.dialog .e{ font-size: 3rem; line-height: 1; }
.dialog h2{ margin: 12px 0 6px; font-size: 1.32rem; font-weight: 750; }
.dialog p{ margin: 0 0 22px; color: var(--label-2); }

/* ---------- Formulário ---------- */
.field{ display: block; background: var(--card); border-radius: 18px; padding: 12px 16px; margin-bottom: 12px; }
.field .lbl{ display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: .9rem; font-weight: 700; color: var(--label); }
.field .lbl i{ font-style: normal; font-weight: 600; font-size: .78rem; color: var(--label-2); background: var(--fill); padding: 2px 8px; border-radius: 999px; }
.field .lbl i.req{ color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.field .help{ display: block; font-size: .82rem; color: var(--label-2); margin: 2px 0 6px; }
.field input, .field textarea{ width: 100%; border: 0; outline: 0; background: var(--fill); border-radius: 12px; padding: 10px 12px; font-size: 1.06rem; min-height: 48px; }
.field textarea{ resize: none; min-height: 84px; line-height: 1.35; }
.field input::placeholder, .field textarea::placeholder{ color: var(--label-3); }
.field:focus-within{ box-shadow: 0 0 0 2.5px var(--accent); }
.field.erro{ box-shadow: 0 0 0 2.5px var(--red); }
.row-input{ display: flex; gap: 8px; align-items: center; }
.paste{ flex: none; height: 48px; padding: 0 16px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 650; font-size: .92rem; }
.swatches{ display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 2px; margin: 0 -2px; scrollbar-width: none; }
.swatches::-webkit-scrollbar{ display: none; }
.sw{ flex: none; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px 0 8px; border-radius: 999px; background: var(--fill); font-size: .86rem; font-weight: 500; }
.sw .dot{ width: 20px; height: 20px; }
.sw.on{ background: color-mix(in srgb, var(--accent) 18%, transparent); box-shadow: inset 0 0 0 2px var(--accent); }
.form-err{ color: var(--red); font-size: .92rem; font-weight: 600; margin: -4px 4px 10px; }
.form-err:empty{ display: none; }
.grid2{ display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.grid2 .field{ margin-bottom: 12px; }

/* ---------- PIN ---------- */
.pin{ text-align: center; padding: 0 0 2px; }
.pin .avatar{ --size: 68px; margin: 0 auto 10px; font-size: 1.5rem; }
.pin h2{ margin: 0 0 4px; font-size: 1.35rem; font-weight: 750; }
.pin-sub{ margin: 0; color: var(--label-2); font-size: 1rem; }
.dots{ display: flex; justify-content: center; gap: 20px; margin: 20px 0 8px; }
.dots i{ width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--label-2); transition: background .15s, transform .15s var(--ease-spring); }
.dots i.on{ background: var(--label); border-color: var(--label); transform: scale(1.08); }
.dots.shake{ animation: shake .42s; }
@keyframes shake{ 20%{ transform: translateX(-12px);} 40%{ transform: translateX(10px);} 60%{ transform: translateX(-7px);} 80%{ transform: translateX(4px);} }
.pin-msg{ min-height: 1.4em; margin: 0 0 4px; color: var(--red); font-weight: 650; font-size: .95rem; }
.pin-dica{ display: inline-flex; align-items: center; gap: 8px; margin: 0 0 12px; padding: 9px 16px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-weight: 650; font-size: .95rem; }
.keys{ display: grid; grid-template-columns: repeat(3, 78px); justify-content: center; gap: 14px 26px; margin-top: 4px; }
.key{ width: 78px; height: 78px; border-radius: 50%; background: var(--fill); font-size: 2rem; font-weight: 400; letter-spacing: 0; display: grid; place-items: center; transition: background .12s, transform .12s; }
.key:active{ background: var(--fill-2); transform: scale(.94); }
.key.del{ background: transparent; color: var(--label-2); }
.key.del svg{ width: 32px; height: 32px; }
.pin-busy .keys{ opacity: .4; pointer-events: none; }
.forgot{ margin-top: 8px; }

/* ---------- Grupos / opções ---------- */
.group{ background: var(--card); border-radius: 18px; overflow: hidden; margin-bottom: 14px; }
.opt{ width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 60px; text-align: left; font-size: 1.02rem; text-decoration: none; color: inherit; }
.opt + .opt{ border-top: .5px solid var(--separator); }
.opt .oi{ width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; }
.opt .oi svg{ width: 20px; height: 20px; }
.opt.red{ color: var(--red); }
.opt .ot{ flex: 1; }
.opt .ot small{ display: block; color: var(--label-2); font-size: .82rem; }
.seg{ display: grid; grid-template-columns: repeat(3, 1fr); background: var(--fill); border-radius: 14px; padding: 3px; gap: 3px; }
.seg button{ height: 48px; border-radius: 11px; font-weight: 650; }
.seg button.on{ background: var(--card); box-shadow: 0 2px 8px rgb(0 0 0 / .12); }
.seg button:nth-child(1){ font-size: .9rem; } .seg button:nth-child(2){ font-size: 1.05rem; } .seg button:nth-child(3){ font-size: 1.22rem; }
.help-steps{ display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.help-steps .step{ padding: 14px; }
.howto{ counter-reset: s; list-style: none; padding: 0; margin: 0 0 18px; display: flex; flex-direction: column; gap: 10px; }
.howto li{ counter-increment: s; display: flex; gap: 12px; align-items: flex-start; background: var(--card); border-radius: 16px; padding: 14px; }
.howto li::before{ content: counter(s); flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 750; letter-spacing: 0; }
.kbd{ display: inline-flex; align-items: center; gap: 4px; background: var(--fill); border-radius: 8px; padding: 1px 8px; font-weight: 650; white-space: nowrap; }
.kbd svg{ width: 16px; height: 16px; }
.lbl-sec{ font-size: .86rem; font-weight: 700; color: var(--label-2); margin: 0 4px 8px; }

/* ---------- Admin ---------- */
.adm-row{ padding: 14px 16px; }
.adm-row + .adm-row{ border-top: .5px solid var(--separator); }
.adm-top{ display: flex; align-items: center; gap: 12px; }
.adm-top .avatar{ --size: 44px; font-size: 1rem; }
.adm-top .an{ flex: 1; font-weight: 650; overflow-wrap: anywhere; }
.adm-top .st{ font-size: .78rem; font-weight: 650; padding: 3px 9px; border-radius: 999px; background: var(--fill); color: var(--label-2); white-space: nowrap; }
.adm-top .st.ok{ background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.adm-acts{ display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; padding-left: 56px; }
.adm-acts .mini-btn.red{ color: var(--red); }

/* ---------- Aviso (toast) ---------- */
.toast{
  position: fixed; left: 12px; right: 12px; margin: 0 auto; width: fit-content; bottom: calc(var(--safe-b) + 22px); z-index: 80; transform: translateY(20px);
  display: flex; align-items: center; gap: 14px; max-width: 560px;
  padding: 10px 10px 10px 22px; min-height: 56px; border-radius: 999px; font-weight: 650; font-size: 1rem; color: var(--label);
  opacity: 0; transition: opacity .25s, transform .35s var(--ease-spring); pointer-events: none;
}
.toast:not(.has-act){ padding-right: 22px; }
.toast.on{ opacity: 1; transform: none; }
.toast.on.has-act{ pointer-events: auto; }
.toast .act{ height: 40px; padding: 0 16px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 700; font-size: .95rem; flex: none; }

/* ---------- Acessibilidade ---------- */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
@media (prefers-reduced-transparency: reduce){
  .glass, .scroll-edge{ -webkit-backdrop-filter: none; backdrop-filter: none; background: rgb(var(--bg-rgb) / .97); }
}
@media (prefers-contrast: more){
  .glass{ box-shadow: inset 0 0 0 1.5px var(--label); }
  .card, .person, .field{ box-shadow: inset 0 0 0 1.5px var(--label-2); }
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  .glass{ background: rgb(var(--bg-rgb) / .95); }
}

async function rpc(fn, args = {}){
  if (!navigator.onLine) throw new Error('Sem internet. Verifique a ligação e tente de novo.');
  if (DEMO) return demo[fn](args);
  const headers = { 'Content-Type': 'application/json', apikey: CONFIG.SUPABASE_KEY };
  if (CONFIG.SUPABASE_KEY.startsWith('eyJ')) headers.Authorization = 'Bearer ' + CONFIG.SUPABASE_KEY;
  let r;
  try {
    r = await fetch(`${CONFIG.SUPABASE_URL.replace(/\/$/, '')}/rest/v1/rpc/${fn}`, { method: 'POST', headers, body: JSON.stringify(args) });
  } catch(e){ throw new Error('Sem ligação. Verifique a internet e tente de novo.'); }
  const txt = await r.text();
  let data = null; try { data = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!r.ok) throw new Error((data && data.message) || 'Algo correu mal. Tente de novo daqui a pouco.');
  return data;
}

    restaurar_item({ p_token, p_id, p_nome, p_link, p_cor, p_detalhes, p_criado_em }){
      const d = db(); const mid = sess(d, p_token);
      if (!d.itens.some(i => i.id === p_id)) d.itens.push({ id: p_id || uid(), membro_id: mid, nome: p_nome, link: p_link, cor: p_cor, detalhes: p_detalhes, criado_em: typeof p_criado_em === 'number' ? p_criado_em : Date.parse(p_criado_em) || Date.now() });
      save(d); return wait(null);
    },
    admin_verificar({ p_codigo }){ const e = adm(p_codigo); return wait(e ? { ok: false, erro: e } : { ok: true }); },
    admin_repor_pin({ p_codigo, p_membro }){
      const e = adm(p_codigo); if (e) return wait({ ok: false, erro: e });
      const d = db(); const m = d.membros.find(x => x.id === p_membro); if (m){ m.pin = '1234'; m.pin_alterado = false; for (const k in d.sessoes) if (d.sessoes[k] === m.id) delete d.sessoes[k]; } save(d); return wait({ ok: true });
    },
    admin_adicionar_membro({ p_codigo, p_nome }){
      const e = adm(p_codigo); if (e) return wait({ ok: false, erro: e });
      const d = db(); const n = (p_nome || '').trim().replace(/\s+/g, ' ');
      if (!n) return wait({ ok: false, erro: 'Escreva o nome.' });
      if (nomeExiste(d, n)) return wait({ ok: false, erro: 'Já existe alguém com esse nome. Use o nome completo ou um apelido (ex.: Tia Ana).' });
      d.membros.push({ id: 'm' + uid().slice(0, 8), nome: n, ordem: Math.max(0, ...d.membros.map(m => m.ordem)) + 1, pin: '1234', pin_alterado: false, tamanhos: {} }); save(d); return wait({ ok: true });
    },
    admin_renomear_membro({ p_codigo, p_membro, p_nome }){
      const e = adm(p_codigo); if (e) return wait({ ok: false, erro: e });
      const d = db(); const n = (p_nome || '').trim().replace(/\s+/g, ' ');
      if (!n) return wait({ ok: false, erro: 'Escreva o nome.' });
      if (nomeExiste(d, n, p_membro)) return wait({ ok: false, erro: 'Já existe alguém com esse nome. Use o nome completo ou um apelido (ex.: Tia Ana).' });
      const m = d.membros.find(x => x.id === p_membro); if (m) m.nome = n; save(d); return wait({ ok: true });
    },
    admin_remover_membro({ p_codigo, p_membro }){
      const e = adm(p_codigo); if (e) return wait({ ok: false, erro: e });
      const d = db(); d.membros = d.membros.filter(m => m.id !== p_membro); d.itens = d.itens.filter(i => i.membro_id !== p_membro); save(d); return wait({ ok: true });
    },
  };
})();

/* ---------------------------- Rotas ----------------------------
   ''            início
   #/bemvindo    primeira visita
   #/entrar      "Quem é você?"
   #/p/<id>      lista de uma pessoa
   #/admin       administração
------------------------------------------------------------------- */
function rota(){
  const h = location.hash;
  let m;
  if ((m = h.match(/^#\/p\/([\w-]+)/))) return { nome: 'perfil', id: m[1], chave: 'p' + m[1] };
  if (h.startsWith('#/bemvindo')) return { nome: 'bemvindo', chave: 'bemvindo' };
  if (h.startsWith('#/entrar')) return { nome: 'entrar', chave: 'entrar' };
  if (h.startsWith('#/admin')) return { nome: 'admin', chave: 'admin' };
  return { nome: 'inicio', chave: 'inicio' };
}
function ir(h, substituir){
  const alvo = h ? '#/' + h : '#';
  const antes = location.hash;
  if (substituir) location.replace(alvo); else location.hash = alvo;
  if (location.hash === antes) render();   // mesma rota: não há hashchange
}
window.addEventListener('hashchange', () => { fecharSheet(true); render(); });

    view.classList.remove('in-fwd', 'in-back'); void view.offsetWidth;
    view.classList.add(r.nome === 'inicio' ? 'in-back' : 'in-fwd');

/* ---------------------------- Folhas ---------------------------- */
let sheetAtual = null;
function abrirSheet(html, { label = '', fixa = false } = {}){
  fecharSheet(true);
  const bd = document.createElement('div');
  bd.className = 'backdrop';
  bd.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="grabber" aria-hidden="true"></div>${html}</div>`;
  bd._fixa = fixa;
  document.body.appendChild(bd);
  document.body.style.overflow = 'hidden';
  bd.addEventListener('click', e => {
    if (e.target.closest('[data-fechar]')) return pedirFecho(bd);
    if (e.target === bd && !fixa) fecharSheet();
  });
  if (!fixa){
    const sh = bd.firstElementChild; let y0 = null, dy = 0;
    sh.addEventListener('touchstart', e => { if (sh.scrollTop <= 0 && !e.target.closest('input,textarea,.keys,.swatches,button')) { y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; } }, { passive: true });
    sh.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
    sh.addEventListener('touchend', () => { if (y0 === null) return; sh.style.transition = 'transform .25s var(--ease-out)'; if (dy > 110) fecharSheet(); else sh.style.transform = ''; y0 = null; });
  }
  sheetAtual = bd;
  return bd;
}
function pedirFecho(bd){
  if (bd._sujo && bd._sujo() && !confirm('Sair sem guardar? O que escreveu vai perder-se.')) return;
  fecharSheet();
}
function fecharSheet(instantaneo){
  const bd = sheetAtual; if (!bd) return;
  sheetAtual = null;
  document.body.style.overflow = '';
  if (instantaneo){ bd.remove(); return; }
  bd.classList.add('out');
  setTimeout(() => bd.remove(), 230);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetAtual) pedirFecho(sheetAtual); });

      <div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <p class="pin-msg" role="alert"></p>
      ${dica ? `<p class="pin-dica">💡 ${dica}</p>` : ''}
      <div class="keys">
        ${[1,2,3,4,5,6,7,8,9].map(k => `<button class="key" data-k="${k}">${k}</button>`).join('')}
        <span></span><button class="key" data-k="0">0</button>
        <button class="key del" data-del aria-label="Apagar número">${I.del}</button>
      </div>
      ${esqueci ? '<button class="link-text forgot" data-esqueci>Esqueci o meu PIN</button>' : ''}
    </div>`, { label: titulo });
  const dots = [...bd.querySelectorAll('.dots i')], dotsBox = $('.dots', bd), msg = $('.pin-msg', bd), sheet = $('.sheet', bd);
  const upd = () => dots.forEach((d, i) => d.classList.toggle('on', i < pin.length));
  const passo = p => { $('#pin-t', bd).textContent = p.titulo; $('#pin-s', bd).textContent = p.sub; const d = $('.pin-dica', bd); if (d) d.remove(); };
  async function digito(k){
    if (ocupado || pin.length >= 4) return;
    vib(); msg.textContent = '';
    pin += k; upd();
    if (pin.length < 4) return;
    ocupado = true; sheet.classList.add('pin-busy');
    await new Promise(r => setTimeout(r, 120));
    let res;
    try { res = await onPin(pin); } catch(e){ res = { erro: e.message }; }
    ocupado = false; sheet.classList.remove('pin-busy');
    if (sheetAtual !== bd) return;
    if (res && res.proximo) passo(res.proximo);
    if (res && res.erro){
      msg.textContent = res.erro;
      dotsBox.classList.remove('shake'); void dotsBox.offsetWidth; dotsBox.classList.add('shake');
      vib([30, 40, 30]);
    }
    pin = ''; upd();
  }
  bd.addEventListener('click', e => {
    const k = e.target.closest('[data-k]'); if (k) return digito(k.dataset.k);
    if (e.target.closest('[data-del]')){ pin = pin.slice(0, -1); upd(); }
    if (e.target.closest('[data-esqueci]')) esqueciPin(m);
  });
  const onKey = e => {
    if (sheetAtual !== bd){ document.removeEventListener('keydown', onKey); return; }
    if (/^\d$/.test(e.key)) digito(e.key);
    else if (e.key === 'Backspace'){ pin = pin.slice(0, -1); upd(); }
  };
  document.addEventListener('keydown', onKey);
  return bd;
}

function pedirLogin(id){
  const m = membro(id); if (!m) return;
  abrirPin({
    m,
    titulo: `Olá, ${m.nome}!`,
    sub: 'Digite o seu PIN de 4 números',
    dica: m.pin_alterado ? '' : 'Primeira vez? O PIN é <b>1 2 3 4</b>',
    async onPin(pin){
      const r = await rpc('entrar', { p_membro: id, p_pin: pin });
      if (!r || !r.ok) return { erro: (r && r.erro) || 'PIN incorreto.' };
      guardarSessao({ token: r.token, membro_id: r.membro_id, nome: r.nome });
      ls.set('presentes-visto', true);
      fecharSheet();
      toast(`Entrou como ${r.nome} ✓`);
      if (rota().id !== id) ir('p/' + id, rota().nome !== 'inicio'); else render();

function alterarPin(pinConhecido){
  if (!S.sessao) return;
  let atual = pinConhecido || null, novo = null;
  const passo = () => !atual ? { titulo: 'PIN atual', sub: 'Digite o PIN que usa hoje' }
    : !novo ? { titulo: 'Novo PIN', sub: 'Escolha 4 números fáceis de lembrar' }
    : { titulo: 'Confirme o novo PIN', sub: 'Digite o novo PIN outra vez' };
  abrirPin({
    m: eu(), ...passo(), esqueci: !pinConhecido,
    async onPin(pin){
      if (!atual){ atual = pin; return { proximo: passo() }; }
      if (!novo){
        if (pin === '1234') return { erro: 'Escolha um PIN diferente de 1234' };
        if (pin === atual) return { erro: 'O novo PIN tem de ser diferente do atual' };
        novo = pin; return { proximo: passo() };
      }
      if (pin !== novo){ novo = null; return { erro: 'Os PINs não são iguais. Tente de novo.', proximo: passo() }; }
      try {
        await rpc('alterar_pin', { p_token: S.sessao.token, p_pin_atual: atual, p_pin_novo: novo });
      } catch(e){
        if (/sessão/i.test(e.message)) return sessaoExpirada();
        if (/atual/i.test(e.message)) atual = null;
        novo = null;
        return { erro: e.message, proximo: passo() };
      }
      const m = eu(); if (m) m.pin_alterado = true;
      fecharSheet();
      toast('PIN alterado ✓ Não se esqueça dele!');
    }
  });
}

let toastT;
function toast(t, { acao, onAcao, dur = 3500 } = {}){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(t)}</span>${acao ? `<button class="act press">${esc(acao)}</button>` : ''}`;
  el.classList.toggle('has-act', !!acao);
  el.classList.add('on');
  if (acao) $('.act', el).onclick = () => { el.classList.remove('on'); clearTimeout(toastT); onAcao && onAcao(); };
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), dur);
}

/* ---------------------------- Eventos ---------------------------- */
document.addEventListener('click', async e => {
  const t = e.target;
  const go = t.closest('[data-go]'); if (go) return ir('p/' + go.dataset.go);
  if (t.closest('[data-inicio]')) return ir('');
  if (t.closest('[data-comecar]')){ ls.set('presentes-visto', true); return ir('entrar', true); }
  if (t.closest('[data-so-ver]')){ ls.set('presentes-visto', true); return ir('', true); }
  if (t.closest('[data-ir-entrar]')) return ir('entrar');
  const sou = t.closest('[data-sou]');
  if (sou){
    const id = sou.dataset.sou;
    if (souEu(id)) return ir('p/' + id, true);
    if (S.sessao) sair();
    return pedirLogin(id);
  }
  if (t.closest('[data-nao-sou]')){ sair(); render(); return ir('entrar'); }
  if (t.closest('[data-ajuda]')) return abrirAjuda();
  if (t.closest('[data-conta]')) return abrirConta();
  if (t.closest('[data-add]')) return abrirItem();
  if (t.closest('[data-tamanhos]')) return abrirTamanhos();
  const ed = t.closest('[data-edit]'); if (ed) return abrirItem(ed.dataset.edit);
  const lg = t.closest('[data-login]'); if (lg){ if (S.sessao) sair(); return pedirLogin(lg.dataset.login); }
  if (t.closest('[data-instalar]')) return abrirInstalar();
  if (t.closest('[data-instalar-nao]')){ ls.set('presentes-instalar-visto', true); return render(); }
  if (t.closest('[data-fechar-aviso]')){ ls.set('presentes-aviso-app', true); return render(); }
  // administração
  const ap = t.closest('[data-adm-pin]');
  if (ap){ const m = membro(ap.dataset.admPin); if (m && confirm(`Repor o PIN de ${m.nome}? O PIN volta a ser 1234.`)) admin('admin_repor_pin', { p_membro: m.id }, `PIN de ${m.nome} reposto para 1234 ✓`); return; }
  const an = t.closest('[data-adm-nome]');
  if (an){ const m = membro(an.dataset.admNome); if (!m) return; const n = prompt('Novo nome:', m.nome); if (n && n.trim() && n.trim() !== m.nome) admin('admin_renomear_membro', { p_membro: m.id, p_nome: n.trim() }, 'Nome alterado ✓'); return; }
  const ad = t.closest('[data-adm-del]');
  if (ad){ const m = membro(ad.dataset.admDel); if (m && confirm(`Remover ${m.nome}? A lista de presentes dessa pessoa também é apagada.`)) admin('admin_remover_membro', { p_membro: m.id }, `${m.nome} foi removido(a)`); return; }
  if (t.closest('[data-adm-sair]')){ ss.set('presentes-admin', null); return ir(''); }
});

function onScroll(){ document.body.classList.toggle('scrolled', window.scrollY > 24); }
window.addEventListener('scroll', onScroll, { passive: true });

/* ---------------------------- Arranque ---------------------------- */
(function init(){
  if (!S.sessao && !ls.get('presentes-visto') && rota().nome === 'inicio') location.replace('#/bemvindo');
  render();
  if (S.sessao){
    rpc('validar_sessao', { p_token: S.sessao.token }).then(r => { if (!r){ guardarSessao(null); render(); } }).catch(() => {});
  }
  carregarMembros();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || sheetAtual) return;
    carregarMembros();
    const r = rota(); if (r.id) carregarItens(r.id);
  });
})();
</script>
